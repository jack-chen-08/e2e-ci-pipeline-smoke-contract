# CI test stack. Project name is set by the workflow (-p e2e-<run_id>) so a leaked stack can
# never collide with a developer's own compose project.
name: e2e

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  stub:
    build: .
    command: ["uvicorn", "stub.main:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health')\""]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      EXTERNAL_STUB_URL: http://stub:8081
    ports:
      - "${DRILL_HTTP_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 3s
      timeout: 3s
      retries: 30
